description:
  en: Runs a Douyin subagent that browses videos and reads comments in valley hours and reports back, with dy_* tools for publishing, signing-backed comment replies, a daily quota timer, and a settings panel (settings → Douyin) for the switch, auto mode, valley windows, rounds per day and report depth.
  zh: 让子代理在谷时刷抖音、读评论并汇报，附带发作品/评论的 dy_* 工具（评论走已登录页面签名直发，不依赖 IM ticket）、每日配额定时，以及设置页里的「刷抖音」控制面板（总开关、自动模式、谷时、每天轮数、报告详细度）。
